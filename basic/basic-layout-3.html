<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 3</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      /* Doe hier jouw ding! */
     body{
        display: grid;
        grid-template-rows: 4fr 1fr 1fr;
        gap: 1rem;
        grid-row-start: 4;
        grid-template-columns: 1fr 1fr;
      }
 
      main{
        grid-column-start: 1;
        grid-column-end: 3;
        grid-row-start: 1;
      }
 
      footer{
        grid-row-start: 2;
        grid-column-start: 1;
        grid-column-end: 3;
      }
 
      header{
        grid-column-start: 1;
      }
 
      nav{
       grid-column-start: 2;
      }
   
    </style>
  </head>
  <body id="basic-layout-3">
    <header><h1>Basic Layout 3</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
